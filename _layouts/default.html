<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
    <script src="{{ '/assets/js/respond.js' | relative_url }}"></script>
    <!--[if lt IE 9]>
    <script src="//html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
    <!--[if lt IE 8]>
    <link rel="stylesheet" href="{{ '/assets/css/ie.css' | relative_url }}">
    <![endif]-->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    {% include head-custom.html %}
    <style>
      #title h1 a { color: inherit; text-decoration: none; }
      figure { margin: 1em 0; }
      figcaption { text-align: center; font-size: 0.85em; color: #999; margin-top: 0.4em; }
      main img, main video { display: block; margin: 1.5em auto; max-width: 100%; }
      main figure { margin: 1.5em auto; }
      main figure img, main figure video { margin: 0 auto; }
      main h1 { margin-top: 1.4em; margin-bottom: 0.6em; }
      main h2 { margin-top: 1.6em; margin-bottom: 0.6em; }
      main h3 { margin-top: 1.4em; margin-bottom: 0.5em; }
      main h4 { margin-top: 1.2em; margin-bottom: 0.5em; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <section>
        <div id="title">
          <h1><a href="{{ '/' | relative_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
          <p>{{ site.tagline | default: site.description | default: site.github.project_tagline }}</p>
          <hr>
        </div>
        <div class="with-sidebar">
          <main>{{ content }}</main>
        </div>
      </section>
    </div>
  </body>
</html>
